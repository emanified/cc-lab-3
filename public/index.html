<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My little dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Eman's dashboard</h1>

    <div class="hero">
      <svg id="mascot" class="mascot sleepy" viewBox="0 0 120 110" aria-hidden="true">
        <circle cx="30" cy="20" r="13" fill="#b9a2ff" />
        <circle cx="90" cy="20" r="13" fill="#b9a2ff" />
        <circle cx="30" cy="20" r="6" fill="#ff9ec4" />
        <circle cx="90" cy="20" r="6" fill="#ff9ec4" />
        <path d="M60 10c28 0 50 20 50 48s-18 46-50 46S10 86 10 58 32 10 60 10z" fill="#b9a2ff" />
        <ellipse cx="60" cy="76" rx="26" ry="19" fill="#e0d4ff" />
        <ellipse cx="29" cy="65" rx="8" ry="5" fill="#ff9ec4" opacity=".75" />
        <ellipse cx="91" cy="65" rx="8" ry="5" fill="#ff9ec4" opacity=".75" />

        <g class="awake-only">
          <circle cx="42" cy="52" r="6.5" fill="#3d2f63" />
          <circle cx="78" cy="52" r="6.5" fill="#3d2f63" />
          <circle cx="44" cy="49.5" r="2.2" fill="#fff" />
          <circle cx="80" cy="49.5" r="2.2" fill="#fff" />
          <path d="M51 64q9 10 18 0" fill="none" stroke="#3d2f63" stroke-width="3" stroke-linecap="round" />
        </g>
        <g class="sleepy-only">
          <path d="M35 53q7 6 14 0" fill="none" stroke="#3d2f63" stroke-width="3" stroke-linecap="round" />
          <path d="M71 53q7 6 14 0" fill="none" stroke="#3d2f63" stroke-width="3" stroke-linecap="round" />
          <circle cx="60" cy="67" r="3" fill="#3d2f63" />
          <text x="94" y="30" font-size="14" font-weight="700" fill="#3d2f63">z</text>
          <text x="103" y="18" font-size="10" font-weight="700" fill="#3d2f63">z</text>
        </g>
      </svg>
      <div class="bubble"><p id="bubble">Waking up…</p></div>
    </div>

    <section class="panel">
      <div class="head">
        <h2>Latest values</h2>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <div id="stats" class="stats"></div>
      <div id="chart" class="chart" role="img" aria-label="Bar chart of the latest values"></div>
    </section>

    <section class="panel">
      <h2>All the numbers</h2>
      <div id="empty" class="empty" hidden>
        <p>Nothing here yet. Add some values from your terminal:</p>
        <p><code>node scripts/query.js seed</code></p>
      </div>
      <div class="table-wrap">
        <table id="table" hidden>
          <thead><tr><th>Label</th><th class="num">Value</th><th>Added</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <footer>made with 💜 on Netlify</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
