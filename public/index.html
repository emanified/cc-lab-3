<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Little Bean Café</title>
  <meta name="description" content="Specialty coffee and fresh pastries, made daily." />
  <link rel="icon" href="logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <img class="logo" src="logo.jpg" width="132" height="132" alt="Little Bean Café logo: a polar bear holding a cup of coffee" />
      <div>
        <h1>Café Bear</h1>
        <p class="tagline">Specialty coffee and fresh pastries, made daily.</p>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <nav id="filters" class="tabs" aria-label="Menu categories"></nav>
      <button id="refresh" type="button" class="link">Refresh menu</button>
    </div>

    <p id="count" class="count"></p>

    <div id="empty" class="empty" hidden>
      <p><strong>The menu is being updated.</strong></p>
      <p>Please check back soon.</p>
      <p class="dev">Developer note: add items with <code>node scripts/query.js seed</code></p>
    </div>

    <div id="menu"></div>
  </main>

  <footer>© <span id="year"></span> Little Bean Café</footer>

  <aside id="tray" class="tray" hidden aria-live="polite">
    <div class="tray-info">
      <span class="tray-label">Your order</span>
      <span id="tray-text" class="tray-text"></span>
    </div>
    <strong id="tray-total" class="tray-total"></strong>
    <button id="clear-tray" type="button" class="clear">Clear</button>
  </aside>

  <script src="app.js"></script>
</body>
</html>
